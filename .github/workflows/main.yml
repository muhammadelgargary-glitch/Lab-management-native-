name: Build Android APK and Web

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Android APK and Web
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Check project
        run: |
          echo "Project files:"
          ls -la
          echo ""
          echo "Checking package.json..."
          test -f package.json
          echo "package.json found."

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Install Expo Web dependencies
        run: |
          npx expo install react-native-web react-dom @expo/metro-runtime

      - name: Expo Doctor
        run: |
          npx expo-doctor || true

      - name: Check Expo configuration
        run: |
          npx expo config --type public

      - name: Install EAS CLI
        run: |
          npm install --global eas-cli

      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is missing."
            exit 1
          fi

          echo "EXPO_TOKEN is available."

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas whoami

      - name: Verify EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Checking EAS project..."
          eas project:info \
            --id c9cc337d-0ac3-4839-b42d-9d2be8387c56

      - name: Export Web
        run: |
          npx expo export --platform web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: medical-lab-web
          path: dist

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive
